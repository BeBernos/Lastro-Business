<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b8afa7"/></marker></defs>
<rect width="980" height="410" rx="20" fill="#14110f"/>
<text x="32" y="44" fill="#f4efe9" font-size="22" font-weight="700">Modelo de segurança</text><g><circle cx="52" cy="92" r="12" fill="#5ccf9a"/>
    <text x="52" y="97" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="97" fill="#f4efe9" font-size="15">Senha da família → PBKDF2-SHA256 (600 mil) → chave AES-256-GCM</text></g><g><circle cx="52" cy="144" r="12" fill="#5ccf9a"/>
    <text x="52" y="149" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="149" fill="#f4efe9" font-size="15">Chave selada pela digital (WebAuthn PRF): nada legível guardado no celular</text></g><g><circle cx="52" cy="196" r="12" fill="#5ccf9a"/>
    <text x="52" y="201" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="201" fill="#f4efe9" font-size="15">O app abre sempre trancado e tranca de novo após 1 minuto fora; trancar apaga da memória</text></g><g><circle cx="52" cy="248" r="12" fill="#5ccf9a"/>
    <text x="52" y="253" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="253" fill="#f4efe9" font-size="15">Servidor e GitHub só veem dado cifrado; o push não leva dado nenhum</text></g><g><circle cx="52" cy="300" r="12" fill="#5ccf9a"/>
    <text x="52" y="305" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="305" fill="#f4efe9" font-size="15">Cotações: o app pede só os códigos e a data — nunca valores</text></g><g><circle cx="52" cy="352" r="12" fill="#ff7a3d"/>
    <text x="52" y="357" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">!</text>
    <text x="78" y="357" fill="#f4efe9" font-size="15">Exceção, opcional: o conector do Claude guarda a chave no servidor até "Desligar"</text></g></svg>