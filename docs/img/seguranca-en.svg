<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b8afa7"/></marker></defs>
<rect width="980" height="410" rx="20" fill="#14110f"/>
<text x="32" y="44" fill="#f4efe9" font-size="22" font-weight="700">Security model</text><g><circle cx="52" cy="92" r="12" fill="#5ccf9a"/>
    <text x="52" y="97" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="97" fill="#f4efe9" font-size="15">Family password → PBKDF2-SHA256 (600k) → AES-256-GCM key</text></g><g><circle cx="52" cy="144" r="12" fill="#5ccf9a"/>
    <text x="52" y="149" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="149" fill="#f4efe9" font-size="15">Key sealed by fingerprint (WebAuthn PRF): nothing readable stored on the phone</text></g><g><circle cx="52" cy="196" r="12" fill="#5ccf9a"/>
    <text x="52" y="201" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="201" fill="#f4efe9" font-size="15">App locks every time it opens and after 1 minute away; locking wipes memory</text></g><g><circle cx="52" cy="248" r="12" fill="#5ccf9a"/>
    <text x="52" y="253" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="253" fill="#f4efe9" font-size="15">Server and GitHub only ever see ciphertext; push messages carry no data</text></g><g><circle cx="52" cy="300" r="12" fill="#5ccf9a"/>
    <text x="52" y="305" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">✓</text>
    <text x="78" y="305" fill="#f4efe9" font-size="15">Quotes: the app asks only for tickers and a date — never amounts</text></g><g><circle cx="52" cy="352" r="12" fill="#ff7a3d"/>
    <text x="52" y="357" text-anchor="middle" fill="#14110f" font-size="13" font-weight="700">!</text>
    <text x="78" y="357" fill="#f4efe9" font-size="15">Exception, opt-in: the Claude connector keeps the key server-side until "Disconnect"</text></g></svg>