<!DOCTYPE html>
<html lang="pt-BR" class="lastro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<!-- o app é escuro sempre: a barra da janela (o app instalado pinta a barra de título com ela) e a faixa de gestos do
     Android no azul-noite da Meia-noite, igual ao manifesto -->
<meta name="theme-color" content="#090D18">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Lastro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div id="moldura" hidden></div>
<div id="moldura-carteira" aria-hidden="true"></div>
<section id="resumo" class="resumo" aria-label="Resumo" hidden></section>
<main id="tela" class="tela"><div class="girando" role="status" aria-label="Carregando"></div></main>
<div id="veu" class="veu" hidden><div id="folha" class="folha" role="dialog" aria-modal="true" aria-label="Menu do app"></div></div>
<div id="aviso" class="aviso" role="status" hidden></div>
<div id="trava" class="tela trava" hidden></div>
<input type="file" id="arquivo" accept=".html,.htm,.json,text/html,application/json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
